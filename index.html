<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>joe_zxq · 小站</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --header-bg: #f9fafb;
    --border: #e0e0e0;
    --border-light: #f0f0f0;
    --text: #333333;
    --muted: #888888;
    --muted-2: #999999;
    --primary: #2185d0;
    --primary-hover: #1678c2;
    --radius: 5px;
  }

  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Lato", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ================= 顶部栏 ================= */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 50px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    z-index: 100;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    object-fit: cover;
    background: #eee;
    border: 1px solid var(--border);
    flex: none;
  }
  .brand-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: .01em;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--muted);
    padding-left: 2px;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-search {
    width: 230px;
    padding: 7px 12px;
    border-radius: 4px;
    border: 1px solid #d0d5dd;
    background: #fff;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .topbar-search::placeholder { color: #aab; }
  .topbar-search:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(33, 133, 208, .15);
  }

  /* ================= 侧边栏 ================= */
  .sidebar {
    position: fixed;
    top: 50px; left: 0; bottom: 0;
    width: 200px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 10px 0;
    overflow-y: auto;
    z-index: 90;
  }
  .side-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 18px;
    border: none;
    border-left: 3px solid transparent;
    background: transparent;
    color: #555;
    font-size: 13.5px;
    font-family: inherit;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
    transition: background .12s, color .12s;
    white-space: nowrap;
    overflow: hidden;
  }
  .side-item svg {
    width: 16px;
    height: 16px;
    flex: none;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .side-item span {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .side-item:hover { background: #f5f7fa; color: #333; }
  .side-item.active {
    background: #eef6fd;
    color: var(--primary);
    border-left-color: var(--primary);
    font-weight: 600;
  }
  .side-divider {
    height: 1px;
    background: var(--border-light);
    margin: 8px 14px;
  }
  .side-label {
    padding: 6px 18px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted-2);
  }

  /* ================= 主内容 ================= */
  .main {
    margin-left: 200px;
    padding: 70px 24px 40px;
    min-height: 100vh;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
  }

  /* ---------- 面板 ---------- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .02);
  }
  .panel-header {
    background: var(--header-bg);
    padding: 10px 15px;
    font-size: 14px;
    font-weight: 600;
    color: #444;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 42px;
  }
  .panel-count {
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
  }
  .panel-body { padding: 15px; }

  /* ---------- 工具网格 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .tool-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font: inherit;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .tool-card:hover {
    border-color: var(--primary);
    box-shadow: 0 2px 8px rgba(33, 133, 208, .12);
    background: #fbfdff;
  }
  .tool-card:active { transform: translateY(1px); }
  .tool-icon {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    background: #eef6fd;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .tool-icon svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .tool-name {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    word-break: break-word;
  }
  .tool-arrow {
    color: var(--muted-2);
    font-size: 15px;
    transition: transform .15s, color .15s;
  }
  .tool-card:hover .tool-arrow {
    color: var(--primary);
    transform: translateX(3px);
  }

  .empty {
    padding: 40px 0;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  /* ---------- 页脚 ---------- */
  .footer {
    padding: 22px 0 8px;
    text-align: center;
    font-size: 12px;
    color: var(--muted-2);
    line-height: 1.8;
  }

  /* ---------- 弹窗 ---------- */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(0, 0, 0, .45);
  }
  .modal.open { display: flex; }
  .modal-box {
    width: 100%;
    max-width: 560px;
    max-height: 86vh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 12px 48px rgba(0, 0, 0, .22);
    animation: pop .2s ease;
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
  }
  .close {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    transition: .15s;
    flex: none;
  }
  .close:hover {
    color: var(--primary);
    border-color: var(--primary);
  }
  .modal-body {
    padding: 18px;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(10px) scale(.98); }
    to { opacity: 1; transform: none; }
  }

  /* ================= 响应式 ================= */
  @media (max-width: 768px) {
    .sidebar {
      top: 50px; left: 0; right: 0; bottom: auto;
      width: auto;
      height: 44px;
      display: flex;
      align-items: stretch;
      padding: 0;
      border-right: none;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      overflow-y: hidden;
    }
    .side-item {
      width: auto;
      height: 44px;
      padding: 0 14px;
      border-left: none;
      border-bottom: 3px solid transparent;
      flex: none;
    }
    .side-item.active {
      border-left-color: transparent;
      border-bottom-color: var(--primary);
      background: transparent;
    }
    .side-divider, .side-label { display: none; }
    .main {
      margin-left: 0;
      padding: 112px 14px 30px;
    }
    .topbar-search { width: 150px; }
    .brand-sub { display: none; }
    .grid { grid-template-columns: 1fr; }
    .modal-body { padding: 14px; }
  }
</style>
</head>
<body>

<!-- ================= 顶部栏 ================= -->
<header class="topbar">
  <div class="topbar-left">
    <img class="avatar"
         src="https://img.atcoder.jp/icons/f0acb42d8b2d81ddd53ae63cc80d4061.png"
         alt="joe_zxq 头像">
    <span class="brand-name">joe_zxq</span>
    <span class="brand-sub">小站</span>
  </div>
  <div class="topbar-right">
    <input id="search" class="topbar-search" type="search" placeholder="搜索工具…" autocomplete="off">
  </div>
</header>

<!-- ================= 侧边栏 ================= -->
<aside class="sidebar" id="sidebar">
  <a class="side-item active" href="#">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>首页</span>
  </a>
  <div class="side-divider"></div>
  <div class="side-label">工具</div>
  <nav id="sideTools"></nav>
</aside>

<!-- ================= 主内容 ================= -->
<main class="main">
  <div class="container">
    <div class="panel">
      <div class="panel-header">
        <span>工具列表</span>
        <span class="panel-count" id="toolCount"></span>
      </div>
      <div class="panel-body">
        <div class="grid" id="grid"></div>
      </div>
    </div>

    <footer class="footer">
      © <span id="year"></span> joe_zxq · 所有计算均在浏览器本地完成，不会上传任何数据
    </footer>
  </div>
</main>

<!-- ================= 弹窗（预留给未来的本地工具） ================= -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">工具</h2>
      <button class="close" id="closeBtn" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
/* =========================================================
   工具清单
   - href：点击后直接跳转到该地址（站内页面 / 外部链接均可）
   - render：不写 href 时，点击会打开弹窗并调用此函数渲染内容
   ========================================================= */
const TOOLS = [
  {
    id: 'atcoder-rating-analyzer',
    name: 'AtCoder Rating 分析器',
    desc: '',
    href: '/atcoder-rating-analyzer'
  },
  {
    id: 'wordlist',
    name: '背单词',
    desc: '读取 wordlist.txt 的单词本，按字典序排序展示，可标记已掌握',
    href: '/wordlist'
  }
];

/* =========================================================
   基础逻辑
   ========================================================= */
const grid       = document.getElementById('grid');
const modal      = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalBody  = document.getElementById('modalBody');
const searchEl   = document.getElementById('search');
const toolCount  = document.getElementById('toolCount');

document.getElementById('year').textContent = new Date().getFullYear();

const ICON = {
  link: '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
  tool: '<svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>'
};

/* 渲染卡片网格 */
function renderGrid(list) {
  grid.innerHTML = '';
  toolCount.textContent = `${list.length} 个工具`;

  if (!list.length) {
    grid.innerHTML = '<div class="empty">没有找到匹配的工具 🤔</div>';
    return;
  }

  list.forEach(t => {
    const isLink = Boolean(t.href);
    const el = document.createElement(isLink ? 'a' : 'button');
    el.className = 'tool-card';

    if (isLink) {
      el.href = t.href;
    } else {
      el.type = 'button';
      el.addEventListener('click', () => openTool(t));
    }

    el.innerHTML =
      `<span class="tool-icon">${isLink ? ICON.link : ICON.tool}</span>` +
      `<span class="tool-name">${t.name}</span>` +
      `<span class="tool-arrow">→</span>`;

    grid.appendChild(el);
  });
}

/* 渲染侧边栏工具导航 */
function renderSidebar(list) {
  const nav = document.getElementById('sideTools');
  nav.innerHTML = '';

  list.forEach(t => {
    const isLink = Boolean(t.href);
    const el = document.createElement(isLink ? 'a' : 'button');
    el.className = 'side-item';

    if (isLink) {
      el.href = t.href;
    } else {
      el.type = 'button';
      el.addEventListener('click', () => openTool(t));
    }

    el.innerHTML = (isLink ? ICON.link : ICON.tool) + `<span>${t.name}</span>`;
    nav.appendChild(el);
  });
}

/* 打开弹窗（供未来的站内工具使用） */
function openTool(t) {
  modalTitle.textContent = t.name;
  modalBody.innerHTML = '';
  if (typeof t.render === 'function') t.render(modalBody);
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => {
    const first = modalBody.querySelector('textarea, input:not([type=checkbox]), select');
    if (first) first.focus();
  }, 60);
}

function closeModal() {
  modal.classList.remove('open');
  document.body.style.overflow = '';
  modalBody.innerHTML = '';
}

document.getElementById('closeBtn').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
});

/* 搜索过滤 */
searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  renderGrid(TOOLS.filter(t =>
    (t.name + t.desc + t.id).toLowerCase().includes(q)
  ));
});

/* 初始渲染 */
renderGrid(TOOLS);
renderSidebar(TOOLS);
</script>
</body>
</html>
