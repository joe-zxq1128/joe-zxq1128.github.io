<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>背单词 - 单词本 & 复盘默写</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f7f8fa; --surface: #fff; --header-bg: #f9fafb;
    --border: #e0e0e0; --border-light: #f0f0f0;
    --text: #333; --muted: #888; --muted-2: #999;
    --primary: #2185d0; --primary-hover: #1678c2;
    --positive: #21ba45; --negative: #db2828; --radius: 5px;
  }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Lato", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }

  /* 开关：隐藏释义 / 音标 / 例句 */
  body.hide-def .word-d { display: none; }
  body.hide-phonetic .word-p { display: none; }
  body.hide-example .word-ex { display: none; }

  /* 顶部栏 */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 50px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 8px; }
  .brand-icon { font-size: 20px; }
  .brand-name { font-size: 16px; font-weight: 700; color: var(--primary); }
  .topbar-search {
    width: 240px; padding: 7px 12px; border-radius: 4px;
    border: 1px solid #d0d5dd; background: #fff; color: var(--text);
    font-size: 13px; font-family: inherit; outline: none;
  }
  .topbar-search:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(33,133,208,.15); }

  /* 侧边栏 */
  .sidebar {
    position: fixed; top: 50px; left: 0; bottom: 0; width: 200px;
    background: var(--surface); border-right: 1px solid var(--border);
    padding: 12px 0; overflow-y: auto; z-index: 90;
  }
  .side-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 11px 18px; border: none; border-left: 3px solid transparent;
    background: transparent; color: #555; font-size: 14px;
    font-family: inherit; text-align: left; cursor: pointer;
  }
  .side-item svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; }
  .side-item:hover { background: #f5f7fa; color: #333; }
  .side-item.active { background: #eef6fd; color: var(--primary); border-left-color: var(--primary); font-weight: 600; }

  /* 主内容 */
  .main { margin-left: 200px; padding: 70px 24px 60px; min-height: 100vh; }
  .container { max-width: 860px; margin: 0 auto; }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,.02);
  }
  .panel-header {
    background: var(--header-bg); padding: 10px 15px; font-size: 14px;
    font-weight: 600; color: #444; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; min-height: 42px; flex-wrap: wrap;
  }
  .header-right {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; font-weight: 400; color: var(--muted);
    flex-wrap: wrap;
  }
  .panel-body { padding: 12px 15px 16px; }

  .progress-wrap { width: 90px; height: 5px; border-radius: 3px; background: #e8e8e8; overflow: hidden; }
  .progress-wrap > i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--positive); transition: width .3s ease; }

  /* 胶囊式开关 */
  .toggle-wrap {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--muted);
    cursor: pointer; user-select: none;
    padding: 2px 0;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 30px;
    height: 17px;
    flex: none;
  }
  .switch input {
    position: absolute;
    opacity: 0;
    width: 100%; height: 100%;
    margin: 0;
    cursor: pointer;
    z-index: 1;
  }
  .switch .slider {
    position: absolute;
    inset: 0;
    background: #ccc;
    border-radius: 17px;
    transition: background .2s;
    pointer-events: none;
  }
  .switch .slider::before {
    content: '';
    position: absolute;
    width: 13px; height: 13px;
    left: 2px; top: 2px;
    background: #fff;
    border-radius: 50%;
    transition: transform .2s;
    box-shadow: 0 1px 2px rgba(0,0,0,.15);
  }
  .switch input:checked + .slider { background: var(--primary); }
  .switch input:checked + .slider::before { transform: translateX(13px); }
  .switch input:focus-visible + .slider { box-shadow: 0 0 0 3px rgba(33,133,208,.25); }

  .btn { font-family: inherit; font-size: 14px; padding: 9px 18px; border-radius: 4px; border: 1px solid transparent; cursor: pointer; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-default { background: #fff; color: #555; border-color: #d0d5dd; }
  .btn-default:hover { border-color: var(--primary); color: var(--primary); }
  .btn-block { width: 100%; }
  .btn-tiny {
    font-size: 12px; padding: 4px 10px; border-radius: 4px;
    border: 1px solid #d0d5dd; background: #fff; color: var(--muted);
    cursor: pointer; font-family: inherit; text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px;
    white-space: nowrap;
  }
  .btn-tiny:hover { border-color: var(--primary); color: var(--primary); }

  /* ================= 单词行：4 列 Grid ================= */
  .letter-title {
    padding: 14px 4px 6px; font-size: 11px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted-2);
    border-bottom: 1px solid #e8e8e8;
  }
  .letter-title:first-child { padding-top: 4px; }

  .word-row {
    display: grid;
    grid-template-columns: 15px 140px 150px 1fr;
    column-gap: 9px;
    align-items: start;
    padding: 9px 6px;
    border-bottom: 1px solid var(--border-light);
    transition: background .12s;
  }
  .word-row:hover { background: #f5f9ff; }

  .word-row .box {
    grid-column: 1; grid-row: 1;
    margin-top: 2px;
    cursor: pointer;
  }

  .word-row .word-w {
    grid-column: 2; grid-row: 1;
    font-weight: 600; font-size: 14px; color: #333;
    word-break: break-word;
    line-height: 1.5;
    cursor: default;
  }

  .word-row .word-p {
    grid-column: 3; grid-row: 1;
    font-family: "Fira Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; color: #5b8def;
    word-break: break-word;
    line-height: 1.5;
    padding-top: 1px;
    cursor: default;
  }

  .word-row .word-d {
    grid-column: 4; grid-row: 1;
    color: var(--muted); font-size: 13px;
    word-break: break-word;
    line-height: 1.6;
    white-space: pre-wrap;
    cursor: default;
  }

  /* 例句行：第 2 列开始，跨到末尾 */
  .word-row .word-ex {
    grid-column: 2 / -1;
    grid-row: 2;
    font-size: 12px; color: #aaa;
    line-height: 1.6;
    margin-top: 3px;
    font-style: italic;
    cursor: default;
  }
  .word-row .word-ex:empty { display: none; }
  /* 例句中的目标单词加粗高亮 */
  .word-row .word-ex b {
    font-weight: 700;
    color: #2185d0;
    font-style: normal;
  }

  .word-row.mastered .word-w {
    text-decoration: line-through; text-decoration-thickness: 1.5px; color: #aaa;
  }
  .word-row.mastered .word-p,
  .word-row.mastered .word-d,
  .word-row.mastered .word-ex { color: #bbb; }
  .word-row.mastered .word-ex b { color: #bbb; }

  .word-row .miss-text { color: #c77; font-size: 12px; font-style: italic; }

  .box {
    appearance: none; -webkit-appearance: none; width: 15px; height: 15px;
    flex: none; margin: 0; border: 1.5px solid #b8c0cc; border-radius: 3px;
    background: #fff; cursor: pointer; position: relative;
  }
  .box:hover { border-color: var(--primary); }
  .box:checked { background: var(--primary); border-color: var(--primary); }
  .box:checked::after {
    content: ''; position: absolute; left: 4px; top: .5px; width: 4px; height: 8px;
    border: solid #fff; border-width: 0 1.8px 1.8px 0; transform: rotate(45deg);
  }

  /* 复盘 */
  .desc { margin: 0 0 18px; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
  .field select { width: 100%; padding: 9px 12px; border: 1px solid #d0d5dd; border-radius: 4px; background: #fff; color: var(--text); font-size: 14px; font-family: inherit; outline: none; cursor: pointer; }
  .field select:focus { border-color: var(--primary); }
  .quiz-note { font-size: 12.5px; color: var(--muted); margin: 4px 0 18px; line-height: 1.7; }

  .quiz-top { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .quiz-top .ok { color: var(--positive); font-weight: 600; }
  .quiz-top .err { color: var(--negative); font-weight: 600; }
  .quiz-bar { height: 5px; border-radius: 3px; background: #e8e8e8; overflow: hidden; margin-bottom: 20px; }
  .quiz-bar > i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--primary); transition: width .3s ease; }
  .quiz-def { font-size: 19px; font-weight: 600; line-height: 1.6; color: #222; margin-bottom: 6px; word-break: break-word; white-space: pre-wrap; }
  .quiz-hintrow { display: flex; align-items: center; gap: 10px; min-height: 28px; margin-bottom: 16px; flex-wrap: wrap; }
  .quiz-hintbtn { font-family: inherit; font-size: 12px; padding: 3px 10px; border-radius: 4px; border: 1px solid #d0d5dd; background: #fff; color: var(--muted); cursor: pointer; }
  .quiz-hintbtn:hover { border-color: var(--primary); color: var(--primary); }
  .quiz-hint { font-size: 12.5px; color: var(--muted); font-family: ui-monospace, monospace; }
  .quiz-form { display: flex; gap: 8px; }
  .quiz-input {
    flex: 1; min-width: 0; padding: 11px 14px; border-radius: 4px;
    border: 1.5px solid #d0d5dd; background: #fff; color: var(--text);
    font-size: 16px; font-family: inherit; font-weight: 500; outline: none;
  }
  .quiz-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(33,133,208,.15); }
  .quiz-input:disabled { opacity: .6; }
  .quiz-form .btn-primary { width: auto; flex: none; padding: 0 22px; }
  .quiz-feedback { min-height: 24px; margin-top: 12px; font-size: 13.5px; font-weight: 600; line-height: 1.6; word-break: break-word; }
  .quiz-feedback.ok { color: var(--positive); }
  .quiz-feedback.err { color: var(--negative); }
  .quiz-feedback .answer { color: var(--text); font-weight: 700; }
  .quiz-feedback .phon { font-family: ui-monospace, monospace; font-weight: 400; color: var(--muted); margin-left: 6px; font-size: 13px; }
  .quiz-feedback .example { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); margin-top: 4px; font-style: italic; }
  .quiz-feedback .example b { font-weight: 700; color: var(--primary); font-style: normal; }

  .quiz-actions { display: flex; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-light); }
  .quiz-actions .btn { flex: 1; }

  .result-face { font-size: 44px; line-height: 1; text-align: center; margin: 4px 0 10px; }
  .result-rate { text-align: center; font-size: 40px; font-weight: 800; color: var(--primary); }
  .result-rate span { font-size: 18px; font-weight: 700; }
  .result-sub { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .result-wrong { background: #fafafa; border: 1px solid var(--border-light); border-radius: 4px; padding: 12px 14px; margin-bottom: 14px; max-height: 240px; overflow: auto; }
  .result-wrong h3 { margin: 0 0 8px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; color: var(--muted-2); }
  .result-wrong ul { list-style: none; margin: 0; padding: 0; }
  .result-wrong li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 6px 0; border-bottom: 1px solid var(--border-light); font-size: 13px; }
  .result-wrong li:last-child { border-bottom: none; }
  .result-wrong li b { color: #333; font-weight: 650; }
  .result-wrong li .rp { font-family: ui-monospace, monospace; color: #5b8def; font-size: 12px; }
  .result-wrong li span { color: var(--muted); font-size: 12px; }
  .result-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .result-actions .btn { flex: 1; min-width: 110px; }

  .empty, .notice { color: var(--muted); font-size: 13.5px; line-height: 1.9; padding: 24px 4px; }
  .notice code { background: #f5f5f5; border: 1px solid var(--border-light); padding: 1px 6px; border-radius: 3px; font-size: 12.5px; font-family: ui-monospace, monospace; }
  .notice input[type=file] { margin-top: 10px; color: var(--text); }

  @media (max-width: 768px) {
    .sidebar { top: 50px; left: 0; right: 0; bottom: auto; width: auto; height: 44px; display: flex; padding: 0; border-right: none; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .side-item { width: auto; height: 44px; padding: 0 16px; border-left: none; border-bottom: 3px solid transparent; flex: none; }
    .side-item.active { border-left-color: transparent; border-bottom-color: var(--primary); background: transparent; }
    .main { margin-left: 0; padding: 112px 14px 50px; }
    .topbar-search { width: 140px; }
    .header-right { gap: 8px; }
    .progress-wrap { width: 50px; }
    .panel-body { padding: 10px 12px 14px; }

    .word-row { grid-template-columns: 15px 85px 100px 1fr; column-gap: 6px; padding: 8px 4px; }
    .word-row .word-w { font-size: 13px; }
    .word-row .word-p { font-size: 11.5px; }
    .word-row .word-d { font-size: 12px; }
    .quiz-form { flex-direction: column; }
    .quiz-form .btn-primary { padding: 11px 20px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left"><span class="brand-icon">📖</span><span class="brand-name">背单词</span></div>
  <input id="search" class="topbar-search" type="search" placeholder="搜索单词…" autocomplete="off">
</header>

<aside class="sidebar" id="sidebar">
  <button class="side-item active" data-view="browse">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>单词本</span>
  </button>
  <button class="side-item" data-view="quiz">
    <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    <span>复盘默写</span>
  </button>
</aside>

<main class="main">
  <div class="container">

    <section id="view-browse">
      <div class="panel">
        <div class="panel-header">
          <span>单词本</span>
          <div class="header-right">
            <span id="ptext">已掌握 0 / 0</span>
            <div class="progress-wrap"><i id="barfill"></i></div>
            <label class="toggle-wrap" title="显示 / 隐藏释义">
              <span>释义</span>
              <span class="switch"><input type="checkbox" id="toggleDef" checked><span class="slider"></span></span>
            </label>
            <label class="toggle-wrap" title="联网获取音标">
              <span>音标</span>
              <span class="switch"><input type="checkbox" id="togglePhonetic" checked><span class="slider"></span></span>
            </label>
            <label class="toggle-wrap" title="联网获取例句">
              <span>例句</span>
              <span class="switch"><input type="checkbox" id="toggleExample" checked><span class="slider"></span></span>
            </label>
            <a class="btn-tiny" href="https://github.com/joe-zxq1128/joe-zxq1128.github.io/edit/main/wordlist/wordlist.txt" target="_blank" rel="noopener" title="前往 GitHub 编辑 wordlist.txt">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
              更新生词表
            </a>
            <button class="btn-tiny" id="clearCache" title="清空音标与例句缓存">清空缓存</button>
            <button class="btn-tiny" id="reset" title="清除掌握标记">重置</button>
          </div>
        </div>
        <div class="panel-body"><div id="list"></div></div>
      </div>
    </section>

    <section id="view-quiz" hidden>
      <div id="quizSetup" class="panel">
        <div class="panel-header">复盘默写</div>
        <div class="panel-body">
          <p class="desc">看中文释义，写出对应的英文单词。答错的单词会自动取消「已掌握」标记。</p>
          <div class="field">
            <label for="quizScope">出题范围</label>
            <select id="quizScope">
              <option value="all">全部单词</option>
              <option value="unmastered">仅未掌握</option>
              <option value="mastered">仅已掌握</option>
            </select>
          </div>
          <div class="field">
            <label for="quizOrder">出题顺序</label>
            <select id="quizOrder"><option value="shuffle">随机打乱</option><option value="alpha">字典序</option></select>
          </div>
          <p class="quiz-note" id="quizNote"></p>
          <button id="quizStart" class="btn btn-primary btn-block">开始复盘</button>
          <p class="quiz-note" style="margin-top:14px">
            释义：ECDICT 2万词条（本地）。音标：dictionaryapi.dev。例句：优先 Wiktionary，失败时回退有道词典，HTML 标签已清洗，目标单词自动加粗。
          </p>
        </div>
      </div>

      <div id="quizPlay" class="panel" hidden>
        <div class="panel-header"><span>答题中</span><div class="header-right" id="quizScore"></div></div>
        <div class="panel-body">
          <div class="quiz-top"><span id="quizProgress">第 1 / 1 题</span></div>
          <div class="quiz-bar"><i id="quizBarFill"></i></div>
          <div class="quiz-def" id="quizDef"></div>
          <div class="quiz-hintrow">
            <button id="quizHintBtn" class="quiz-hintbtn" type="button">💡 提示</button>
            <span class="quiz-hint" id="quizHint"></span>
          </div>
          <form class="quiz-form" id="quizForm" autocomplete="off">
            <input id="quizInput" class="quiz-input" type="text" placeholder="输入英文单词…" spellcheck="false" autocapitalize="off" autocorrect="off">
            <button type="submit" class="btn btn-primary" id="quizSubmit">提交</button>
          </form>
          <div class="quiz-feedback" id="quizFeedback"></div>
          <div class="quiz-actions">
            <button id="quizSkip" class="btn btn-default" type="button">跳过</button>
            <button id="quizQuit" class="btn btn-default" type="button">结束复盘</button>
          </div>
        </div>
      </div>

      <div id="quizResult" class="panel" hidden></div>
    </section>

  </div>
</main>

<script>
(function () {
  'use strict';

  /* =========================================================
     配置
     ========================================================= */
  const MASTER_KEY          = 'words-tool-mastered-v13';
  const PHONETIC_CACHE_KEY  = 'words-tool-phonetic-v5';
  const EXAMPLE_CACHE_KEY   = 'words-tool-example-v5';
  const SHOW_DEF_KEY        = 'words-tool-show-def-v3';
  const AUTO_PHONETIC_KEY   = 'words-tool-auto-phonetic-v3';
  const AUTO_EXAMPLE_KEY    = 'words-tool-auto-example-v1';
  const SOURCES = ['wordlist.txt'];

  const ECDICT_URL = 'https://raw.githubusercontent.com/FluentRead/FluentRead/refs/heads/main/assets/optional/ecdict-core-full.json';
  const PHONETIC_API = 'https://api.dictionaryapi.dev/api/v2/entries/en/';
  const WIKTIONARY_API = 'https://en.wiktionary.org/api/rest_v1/page/definition/';
  const YOUDAO_API = 'https://dict.youdao.com/jsonapi?q=';
  const FETCH_TIMEOUT = 8000;

  /* =========================================================
     状态
     ========================================================= */
  const state = {
    words: [],
    query: '',
    mastered: loadMastered(),
    view: 'browse'
  };

  const quiz = {
    pane: 'setup', running: false, questions: [],
    index: 0, correct: 0, wrong: [], answered: false
  };

  let nextTimer = null;
  let dict = new Map();

  let phoneticCache = loadCache(PHONETIC_CACHE_KEY);
  let exampleCache  = loadCache(EXAMPLE_CACHE_KEY);

  let showDef = getBoolPref(SHOW_DEF_KEY, true);
  let autoPhonetic = getBoolPref(AUTO_PHONETIC_KEY, true);
  let autoExample  = getBoolPref(AUTO_EXAMPLE_KEY, true);

  /* =========================================================
     工具
     ========================================================= */
  const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = s => String(s).replace(/[&<>"']/g, c => ESC_MAP[c]);
  const normalize = s => String(s).trim().toLowerCase().replace(/\s+/g, ' ');

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function unescapeNewlines(s) {
    return String(s).replace(/\\n/g, '\n').replace(/\\r/g, '');
  }

  function fetchWithTimeout(url) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT);
    return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
  }

  function loadCache(key) {
    try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : {}; }
    catch (e) { return {}; }
  }
  function saveCache(key, obj) {
    try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
  }

  function getBoolPref(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? fallback : v === '1';
    } catch (e) { return fallback; }
  }
  function setBoolPref(key, val) {
    try { localStorage.setItem(key, val ? '1' : '0'); } catch (e) {}
  }

  function loadMastered() {
    try { const r = localStorage.getItem(MASTER_KEY); return new Set(r ? JSON.parse(r) : []); }
    catch (e) { return new Set(); }
  }
  function saveMastered() {
    try { localStorage.setItem(MASTER_KEY, JSON.stringify([...state.mastered])); } catch (e) {}
  }

  /* =========================================================
     加载 ECDICT 词库
     ========================================================= */
  async function loadDict() {
    const res = await fetch(ECDICT_URL, { cache: 'force-cache' });
    if (!res.ok) throw new Error('词库加载失败：HTTP ' + res.status);
    const rows = await res.json();

    dict.clear();
    for (const row of rows) {
      if (!Array.isArray(row) || row.length < 4) continue;
      const word = String(row[0] || '').trim().toLowerCase();
      if (!word) continue;
      dict.set(word, {
        phonetic: String(row[1] || '').trim(),
        definition: unescapeNewlines(row[2]),
        translation: unescapeNewlines(row[3])
      });
    }
  }

  function lookup(word) {
    return dict.get(word.toLowerCase()) || null;
  }

  /* =========================================================
     音标：dictionaryapi.dev
     ========================================================= */
  const phoneticQueue = [];
  const phoneticPending = new Set();
  let phoneticRunning = 0;
  const PHONETIC_CONCURRENCY = 3;

  function enqueuePhonetic(word) {
    if (!autoPhonetic) return;
    const key = word.toLowerCase();
    if (phoneticCache[key] !== undefined) return;
    if (!/^[A-Za-z][A-Za-z'’\-]*$/.test(word)) return;
    if (phoneticPending.has(key)) return;
    if (phoneticQueue.some(j => j.key === key)) return;
    phoneticQueue.push({ key, word });
    pumpPhonetic();
  }

  function pumpPhonetic() {
    while (autoPhonetic && phoneticRunning < PHONETIC_CONCURRENCY && phoneticQueue.length) {
      const job = phoneticQueue.shift();
      phoneticPending.add(job.key);
      phoneticRunning++;
      fetchPhonetic(job.word)
        .then(ph => {
          phoneticCache[job.key] = ph || '';
          saveCache(PHONETIC_CACHE_KEY, phoneticCache);
          updatePhoneticDom(job.key);
        })
        .catch(() => {
          phoneticCache[job.key] = '';
          saveCache(PHONETIC_CACHE_KEY, phoneticCache);
        })
        .finally(() => {
          phoneticPending.delete(job.key);
          phoneticRunning--;
          pumpPhonetic();
        });
    }
  }

  async function fetchPhonetic(word) {
    const url = PHONETIC_API + encodeURIComponent(word);
    const res = await fetchWithTimeout(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) return '';
    for (const entry of data) {
      if (entry.phonetic) return String(entry.phonetic).replace(/[\/\[\]]/g, '').trim();
      if (Array.isArray(entry.phonetics)) {
        for (const p of entry.phonetics) {
          if (p && p.text) return String(p.text).replace(/[\/\[\]]/g, '').trim();
        }
      }
    }
    return '';
  }

  function updatePhoneticDom(key) {
    const ph = phoneticCache[key];
    if (!ph) return;
    let nodes;
    try { nodes = document.querySelectorAll('.word-row[data-key="' + CSS.escape(key) + '"] .word-p'); }
    catch (e) { nodes = []; }
    nodes.forEach(el => {
      el.textContent = '/' + ph + '/';
    });
  }

  /* =========================================================
     例句：Wiktionary 优先 → 有道回退
     ========================================================= */
  const exampleQueue = [];
  const examplePending = new Set();
  let exampleRunning = 0;
  const EXAMPLE_CONCURRENCY = 2;

  function enqueueExample(word) {
    if (!autoExample) return;
    const key = word.toLowerCase();
    if (exampleCache[key] !== undefined) return;
    if (!/^[A-Za-z][A-Za-z'’\-]*$/.test(word)) return;
    if (examplePending.has(key)) return;
    if (exampleQueue.some(j => j.key === key)) return;
    exampleQueue.push({ key, word });
    pumpExample();
  }

  function pumpExample() {
    while (autoExample && exampleRunning < EXAMPLE_CONCURRENCY && exampleQueue.length) {
      const job = exampleQueue.shift();
      examplePending.add(job.key);
      exampleRunning++;
      fetchExamplesWithFallback(job.word)
        .then(examples => {
          exampleCache[job.key] = examples || [];
          saveCache(EXAMPLE_CACHE_KEY, exampleCache);
          updateExampleDom(job.key);
        })
        .catch(() => {
          exampleCache[job.key] = [];
          saveCache(EXAMPLE_CACHE_KEY, exampleCache);
        })
        .finally(() => {
          examplePending.delete(job.key);
          exampleRunning--;
          pumpExample();
        });
    }
  }

  /* 优先 Wiktionary，失败或空时回退有道 */
  async function fetchExamplesWithFallback(word) {
    let examples = [];
    try {
      examples = await fetchWiktionaryExamples(word);
    } catch (e) { /* 忽略，走回退 */ }
    if (examples.length) return examples;

    try {
      examples = await fetchYoudaoExamples(word);
    } catch (e) { /* 忽略 */ }
    return examples;
  }

  /* ---------- Wiktionary ---------- */
  async function fetchWiktionaryExamples(word) {
    const url = WIKTIONARY_API + encodeURIComponent(word);
    const res = await fetchWithTimeout(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return parseWiktionaryExamples(data, word);
  }

  function parseWiktionaryExamples(data, targetWord) {
    const out = [];
    const en = data && data.en;
    if (!Array.isArray(en)) return out;

    for (const entry of en) {
      if (!Array.isArray(entry.definitions)) continue;
      for (const def of entry.definitions) {
        // 优先使用 parsedExamples（结构化 HTML，稍后清洗）
        if (Array.isArray(def.parsedExamples)) {
          for (const pe of def.parsedExamples) {
            if (pe && pe.example) {
              const raw = String(pe.example);
              if (out.length < 2) {
                const clean = cleanExampleHtml(raw, targetWord);
                if (clean && clean.length > 10 && clean.length < 240 && !out.includes(clean)) {
                  out.push(clean);
                }
              }
            }
          }
        }
        // 回退到纯文本 examples
        if (out.length < 2 && Array.isArray(def.examples)) {
          for (const ex of def.examples) {
            if (typeof ex === 'string') {
              const clean = highlightTargetWord(escapeHtml(ex.trim()), targetWord);
              if (clean.length > 10 && clean.length < 240 && out.length < 2 && !out.includes(clean)) {
                out.push(clean);
              }
            }
          }
        }
        if (out.length >= 2) break;
      }
      if (out.length >= 2) break;
    }
    return out;
  }

  /* 清洗 Wiktionary 的 HTML：去标签、解码实体、转义、再加粗目标词 */
  function cleanExampleHtml(html, targetWord) {
    let s = String(html);

    // 1. 解码常见 HTML 实体
    s = s.replace(/&amp;/g, '&')
         .replace(/&lt;/g, '<')
         .replace(/&gt;/g, '>')
         .replace(/&quot;/g, '"')
         .replace(/&#39;/g, "'")
         .replace(/&nbsp;/g, ' ');

    // 2. 去掉所有 HTML 标签，保留文本内容
    s = s.replace(/<[^>]+>/g, ' ');

    // 3. 压缩空白
    s = s.replace(/\s+/g, ' ').trim();

    // 4. 转义 HTML 特殊字符（因为我们即将把结果作为 HTML 插入 innerHTML）
    s = escapeHtml(s);

    // 5. 给目标单词加粗
    s = highlightTargetWord(s, targetWord);

    return s;
  }

  /* 在已经转义的文本中，给目标单词加上 <b> 标签（不破坏已有转义） */
  function highlightTargetWord(escapedText, targetWord) {
    if (!targetWord) return escapedText;
    // 按单词边界匹配，不区分大小写；保留原始大小写
    const re = new RegExp('\\b(' + escapeRegExp(targetWord) + ')\\b', 'gi');
    return escapedText.replace(re, '<b>$1</b>');
  }

  function escapeRegExp(s) {
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  /* 转义 HTML 特殊字符，用于最终 innerHTML 插入 */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ESC_MAP[c]);
  }

  /* ---------- 有道词典（回退） ---------- */
  async function fetchYoudaoExamples(word) {
    const url = YOUDAO_API + encodeURIComponent(word);
    const res = await fetchWithTimeout(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return parseYoudaoExamples(data, word);
  }

  function parseYoudaoExamples(data, targetWord) {
    const out = [];
    if (!data) return out;

    // 优先双语例句 blng_sents_part
    const blng = data.blng_sents_part && data.blng_sents_part['sentence-pair'];
    if (Array.isArray(blng)) {
      for (const item of blng) {
        if (out.length >= 2) break;
        const en = item.sentence || item['sentence-eng'] || '';
        if (en) {
          const escaped = escapeHtml(String(en).trim());
          const highlighted = highlightTargetWord(escaped, targetWord);
          if (highlighted.length > 10 && highlighted.length < 300) {
            out.push(highlighted);
          }
        }
      }
    }

    // 回退权威例句 auth_sents_part
    if (out.length < 2) {
      const auth = data.auth_sents_part && data.auth_sents_part.sent;
      if (Array.isArray(auth)) {
        for (const item of auth) {
          if (out.length >= 2) break;
          const en = item.eng || '';
          if (en) {
            const escaped = escapeHtml(String(en).trim());
            const highlighted = highlightTargetWord(escaped, targetWord);
            if (highlighted.length > 10 && highlighted.length < 300) {
              out.push(highlighted);
            }
          }
        }
      }
    }
    return out;
  }

  /* 更新例句 DOM */
  function updateExampleDom(key) {
    const exs = exampleCache[key];
    if (!Array.isArray(exs) || !exs.length) return;
    let nodes;
    try { nodes = document.querySelectorAll('.word-row[data-key="' + CSS.escape(key) + '"] .word-ex'); }
    catch (e) { nodes = []; }
    nodes.forEach(el => {
      el.innerHTML = exs.map(ex => '“' + ex + '”').join('<br>');
    });
  }

  /* =========================================================
     视口触发
     ========================================================= */
  const io = ('IntersectionObserver' in window)
    ? new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (!e.isIntersecting) return;
          io.unobserve(e.target);
          const key = e.target.dataset.key;
          const word = e.target.dataset.word;
          if (autoPhonetic && phoneticCache[key] === undefined && !lookup(word)?.phonetic) {
            enqueuePhonetic(word);
          }
          if (autoExample && exampleCache[key] === undefined) {
            enqueueExample(word);
          }
        });
      }, { rootMargin: '260px' })
    : null;

  /* =========================================================
     解析 wordlist.txt
     ========================================================= */
  function parseWords(text) {
    const out = [];
    const seen = new Set();
    for (const raw of text.split(/\r?\n/)) {
      const word = raw.replace(/^\uFEFF/, '').trim();
      if (!word || word.startsWith('#') || word.startsWith('//')) continue;
      const key = word.toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);
      out.push({ word, key });
    }
    out.sort((a, b) =>
      a.key.localeCompare(b.key, 'en', { sensitivity: 'base', numeric: true }) ||
      a.word.localeCompare(b.word, 'en')
    );
    return out;
  }

  /* =========================================================
     单词本渲染
     ========================================================= */
  function renderBrowse() {
    const listEl = document.getElementById('list');
    const q = state.query.trim().toLowerCase();
    const items = q ? state.words.filter(w => w.key.includes(q)) : state.words;

    if (!items.length) {
      listEl.innerHTML = '<p class="empty">' +
        (state.words.length ? '没有匹配的单词 🤔' : '文件中没有解析到单词。') + '</p>';
      updateProgress();
      return;
    }

    let html = '';
    let curLetter = null;

    for (const w of items) {
      const first = w.word.charAt(0);
      const letter = /[a-z]/i.test(first) ? first.toUpperCase() : '#';
      if (letter !== curLetter) {
        curLetter = letter;
        html += '<div class="letter-title">' + esc(letter) + '</div>';
      }

      const mastered = state.mastered.has(w.key);
      const dictData = lookup(w.word);
      const ph = (dictData && dictData.phonetic) || phoneticCache[w.key] || '';
      const trans = dictData && dictData.translation ? dictData.translation : '';
      const exs = Array.isArray(exampleCache[w.key]) ? exampleCache[w.key] : [];

      let defHtml;
      if (trans) {
        defHtml = esc(trans);
      } else if (dictData) {
        defHtml = '<span class="miss-text">（词库中无中文释义）</span>';
      } else {
        defHtml = '<span class="miss-text">（未收录）</span>';
      }

      // 例句已经过清洗和高亮，直接作为 HTML 插入
      const exHtml = exs.length
        ? exs.map(ex => '“' + ex + '”').join('<br>')
        : '';

      html +=
        '<div class="word-row' + (mastered ? ' mastered' : '') + '" data-key="' + esc(w.key) + '" data-word="' + esc(w.word) + '">' +
          '<input type="checkbox" class="box"' + (mastered ? ' checked' : '') + '>' +
          '<span class="word-w">' + esc(w.word) + '</span>' +
          '<span class="word-p">' + (ph ? '/' + esc(ph) + '/' : '') + '</span>' +
          '<span class="word-d">' + defHtml + '</span>' +
          '<span class="word-ex">' + exHtml + '</span>' +
        '</div>';
    }

    listEl.innerHTML = html;
    updateProgress();

    if (io) {
      listEl.querySelectorAll('.word-row').forEach(el => {
        const key = el.dataset.key;
        const needP = autoPhonetic && phoneticCache[key] === undefined && !lookup(el.dataset.word)?.phonetic;
        const needE = autoExample && exampleCache[key] === undefined;
        if (needP || needE) io.observe(el);
      });
    }
  }

  function updateProgress() {
    const total = state.words.length;
    let done = 0;
    for (const w of state.words) if (state.mastered.has(w.key)) done++;
    document.getElementById('barfill').style.width = total ? (done / total * 100) + '%' : '0%';
    document.getElementById('ptext').textContent = '已掌握 ' + done + ' / ' + total;
  }

  function setWords(text) {
    state.words = parseWords(text);
    renderBrowse();
    updateQuizNote();
  }

  /* =========================================================
     视图切换
     ========================================================= */
  function setView(v) {
    state.view = v;
    document.querySelectorAll('.side-item').forEach(b =>
      b.classList.toggle('active', b.dataset.view === v)
    );
    document.getElementById('view-browse').hidden = v !== 'browse';
    document.getElementById('view-quiz').hidden = v !== 'quiz';
    document.getElementById('search').hidden = v !== 'browse';

    if (v === 'quiz') {
      if (quiz.pane === 'play' && quiz.running) { showQuizPane('play'); focusQuizInput(); }
      else if (quiz.pane === 'result') showQuizPane('result');
      else showQuizPane('setup');
      updateQuizNote();
    } else {
      renderBrowse();
    }
  }

  function showQuizPane(name) {
    quiz.pane = name;
    document.getElementById('quizSetup').hidden  = name !== 'setup';
    document.getElementById('quizPlay').hidden   = name !== 'play';
    document.getElementById('quizResult').hidden = name !== 'result';
  }

  /* =========================================================
     复盘
     ========================================================= */
  function getPool(scope) {
    let pool = state.words.filter(w => {
      const d = lookup(w.word);
      return d && d.translation;
    });
    if (scope === 'unmastered') pool = pool.filter(w => !state.mastered.has(w.key));
    else if (scope === 'mastered') pool = pool.filter(w => state.mastered.has(w.key));
    return pool;
  }

  function updateQuizNote() {
    const scopeEl = document.getElementById('quizScope');
    if (!scopeEl) return;
    const n = getPool(scopeEl.value).length;
    const note = document.getElementById('quizNote');
    const btn = document.getElementById('quizStart');
    if (n === 0) {
      note.textContent = '该范围内没有可用的单词（需要词库中有中文释义），换个范围试试吧。';
      btn.disabled = true;
    } else {
      note.textContent = '本次共 ' + n + ' 个单词';
      btn.disabled = false;
    }
  }

  function startQuiz(pool) {
    if (!pool || !pool.length) return;
    const order = document.getElementById('quizOrder').value;
    quiz.questions = order === 'shuffle' ? shuffle(pool) : pool.slice();
    quiz.index = 0; quiz.correct = 0; quiz.wrong = []; quiz.answered = false; quiz.running = true;
    clearTimeout(nextTimer); nextTimer = null;
    showQuizPane('play');
    showQuestion();
  }

  function currentDictData(q) { return lookup(q.word) || {}; }

  function showQuestion() {
    const q = quiz.questions[quiz.index];
    const data = currentDictData(q);
    document.getElementById('quizDef').textContent = data.translation || '（无中文释义）';
    document.getElementById('quizHint').textContent = '';
    document.getElementById('quizInput').value = '';
    document.getElementById('quizInput').disabled = false;
    document.getElementById('quizSubmit').textContent = '提交';
    const fb = document.getElementById('quizFeedback');
    fb.className = 'quiz-feedback'; fb.innerHTML = '';
    quiz.answered = false;
    updateQuizProgress();
    focusQuizInput();

    if (autoPhonetic && phoneticCache[q.key] === undefined && !data.phonetic) enqueuePhonetic(q.word);
    if (autoExample && exampleCache[q.key] === undefined) enqueueExample(q.word);
  }

  function focusQuizInput() {
    setTimeout(() => {
      const input = document.getElementById('quizInput');
      if (input && !input.disabled && !document.getElementById('quizPlay').hidden) input.focus();
    }, 60);
  }

  function updateQuizProgress() {
    const total = quiz.questions.length;
    const cur = quiz.index + 1;
    document.getElementById('quizProgress').textContent = '第 ' + cur + ' / ' + total + ' 题';
    document.getElementById('quizScore').innerHTML =
      '<span class="ok">✓ ' + quiz.correct + '</span>&nbsp;&nbsp;<span class="err">✗ ' + quiz.wrong.length + '</span>';
    document.getElementById('quizBarFill').style.width = total ? (cur / total * 100) + '%' : '0%';
  }

  function checkAnswer(input, answer) {
    const a = normalize(input);
    if (!a) return false;
    const full = normalize(answer);
    if (a === full) return true;
    return full.split(/[\/,;]/).map(s => s.trim()).filter(Boolean).includes(a);
  }

  function buildFeedbackHtml(q, prefixHtml) {
    const dictData = currentDictData(q);
    const ph = dictData.phonetic || phoneticCache[q.key] || '';
    const exs = Array.isArray(exampleCache[q.key]) ? exampleCache[q.key] : [];
    return prefixHtml +
      (ph ? '<span class="phon">/' + esc(ph) + '/</span>' : '') +
      (exs.length ? '<span class="example">“' + exs[0] + '”</span>' : '');
  }

  function submitAnswer() {
    if (!quiz.running) return;
    if (quiz.answered) { nextQuestion(); return; }
    const inputEl = document.getElementById('quizInput');
    const raw = inputEl.value;
    if (!raw.trim()) { inputEl.focus(); return; }

    const q = quiz.questions[quiz.index];
    quiz.answered = true;
    inputEl.disabled = true;
    const fb = document.getElementById('quizFeedback');

    if (checkAnswer(raw, q.word)) {
      quiz.correct++;
      fb.className = 'quiz-feedback ok';
      fb.innerHTML = buildFeedbackHtml(q, '✓ 正确');
      document.getElementById('quizSubmit').textContent = '下一题';
      updateQuizProgress();
      nextTimer = setTimeout(nextQuestion, 900);
    } else {
      quiz.wrong.push(q);
      fb.className = 'quiz-feedback err';
      fb.innerHTML = buildFeedbackHtml(q,
        '✗ 正确答案：<span class="answer">' + esc(q.word) + '</span>');
      document.getElementById('quizSubmit').textContent = '下一题';
      updateQuizProgress();
      document.getElementById('quizSubmit').focus();
    }
  }

  function nextQuestion() {
    clearTimeout(nextTimer); nextTimer = null;
    if (!quiz.running) return;
    if (quiz.index + 1 >= quiz.questions.length) { finishQuiz(); return; }
    quiz.index++;
    showQuestion();
  }

  function skipQuestion() {
    if (!quiz.running) return;
    if (quiz.answered) { nextQuestion(); return; }
    const q = quiz.questions[quiz.index];
    quiz.answered = true;
    quiz.wrong.push(q);
    document.getElementById('quizInput').disabled = true;
    const fb = document.getElementById('quizFeedback');
    fb.className = 'quiz-feedback err';
    fb.innerHTML = buildFeedbackHtml(q,
      '已跳过 · 正确答案：<span class="answer">' + esc(q.word) + '</span>');
    document.getElementById('quizSubmit').textContent = '下一题';
    updateQuizProgress();
    document.getElementById('quizSubmit').focus();
  }

  function finishQuiz() {
    clearTimeout(nextTimer); nextTimer = null;
    quiz.running = false;

    const total = quiz.questions.length;
    const correct = quiz.correct;
    const wrong = quiz.wrong;
    const rate = total ? Math.round(correct / total * 100) : 0;

    let unmarked = 0;
    for (const w of wrong) { if (state.mastered.delete(w.key)) unmarked++; }
    if (unmarked) saveMastered();

    const face = rate >= 90 ? '😎' : rate >= 70 ? '🙂' : rate >= 50 ? '😐' : '😣';
    let html =
      '<div class="panel-header">复盘结果</div>' +
      '<div class="panel-body">' +
        '<div class="result-face">' + face + '</div>' +
        '<div class="result-rate">' + rate + '<span>%</span></div>' +
        '<div class="result-sub">正确 ' + correct + ' / ' + total + '</div>';

    if (wrong.length) {
      html += '<div class="result-wrong"><h3>错题回顾</h3><ul>' +
        wrong.map(w => {
          const dictData = lookup(w.word) || {};
          const ph = dictData.phonetic || phoneticCache[w.key] || '';
          const exs = Array.isArray(exampleCache[w.key]) ? exampleCache[w.key] : [];
          return '<li><b>' + esc(w.word) + '</b>' +
            (ph ? '<span class="rp">/' + esc(ph) + '/</span>' : '') +
            '<span>' + esc(dictData.translation || '') + (exs.length ? ' · “' + exs[0] + '”' : '') + '</span></li>';
        }).join('') +
        '</ul></div>';
      if (unmarked) html += '<p class="quiz-note">已将 ' + unmarked + ' 个答错的单词标记为「未掌握」。</p>';
    } else {
      html += '<p class="quiz-note">全部答对，太棒了！</p>';
    }

    html += '<div class="result-actions">' +
      (wrong.length ? '<button id="btnRetryWrong" class="btn btn-primary">重做错题</button>' : '') +
      '<button id="btnAgain" class="btn btn-default">再来一轮</button>' +
      '<button id="btnBackBrowse" class="btn btn-default">返回单词本</button>' +
      '</div></div>';

    const resultEl = document.getElementById('quizResult');
    resultEl.innerHTML = html;
    showQuizPane('result');

    const retryBtn = document.getElementById('btnRetryWrong');
    if (retryBtn) {
      retryBtn.addEventListener('click', () => {
        const list = wrong.slice();
        quiz.wrong = [];
        startQuiz(list);
        quiz.questions = list; quiz.index = 0; quiz.correct = 0; quiz.running = true;
        showQuizPane('play'); showQuestion();
      });
    }
    document.getElementById('btnAgain').addEventListener('click', () => {
      startQuiz(getPool(document.getElementById('quizScope').value));
    });
    document.getElementById('btnBackBrowse').addEventListener('click', () => {
      renderBrowse(); setView('browse');
    });
  }

  /* =========================================================
     启动
     ========================================================= */
  async function init() {
    try {
      await loadDict();
    } catch (err) {
      document.getElementById('list').innerHTML =
        '<div class="notice">' +
          '<p><strong>扩展词库加载失败</strong>（' + esc(err.message) + '）</p>' +
          '<p>请检查网络是否能访问 GitHub Raw。如果访问不稳定，可以把 <code>ecdict-core-full.json</code> 下载到本地同目录，然后将代码里的 <code>ECDICT_URL</code> 改为 <code>ecdict-core-full.json</code>。</p>' +
        '</div>';
      return;
    }

    for (const name of SOURCES) {
      try {
        const res = await fetch(name, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        setWords(await res.text());
        return;
      } catch (err) { /* 尝试下一个 */ }
    }
    showFallback('无法读取 wordlist.txt');
  }

  function showFallback(errMsg) {
    document.getElementById('list').innerHTML =
      '<div class="notice">' +
        '<p><strong>无法自动读取 wordlist.txt</strong>（' + esc(errMsg) + '）</p>' +
        '<p>请在该目录下执行 <code>python -m http.server 8000</code> 后通过本地服务器访问，或手动选择文件：</p>' +
        '<input type="file" id="fileInput" accept=".txt,text/plain">' +
      '</div>';
    document.getElementById('fileInput').addEventListener('change', e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => setWords(String(reader.result || ''));
      reader.readAsText(file, 'utf-8');
    });
  }

  /* =========================================================
     胶囊开关：释义
     ========================================================= */
  function syncDefToggle() {
    document.body.classList.toggle('hide-def', !showDef);
    document.getElementById('toggleDef').checked = showDef;
  }
  document.getElementById('toggleDef').addEventListener('change', e => {
    showDef = e.target.checked;
    setBoolPref(SHOW_DEF_KEY, showDef);
    syncDefToggle();
  });

  /* =========================================================
     胶囊开关：音标
     ========================================================= */
  function syncPhoneticToggle() {
    document.body.classList.toggle('hide-phonetic', !autoPhonetic);
    document.getElementById('togglePhonetic').checked = autoPhonetic;
  }
  document.getElementById('togglePhonetic').addEventListener('change', e => {
    autoPhonetic = e.target.checked;
    setBoolPref(AUTO_PHONETIC_KEY, autoPhonetic);
    syncPhoneticToggle();
    if (autoPhonetic) {
      document.querySelectorAll('#list .word-row').forEach(el => {
        const key = el.dataset.key;
        if (phoneticCache[key] !== undefined) return;
        if (lookup(el.dataset.word)?.phonetic) return;
        if (io) io.observe(el); else enqueuePhonetic(el.dataset.word);
      });
    } else {
      phoneticQueue.length = 0;
    }
  });

  /* =========================================================
     胶囊开关：例句
     ========================================================= */
  function syncExampleToggle() {
    document.body.classList.toggle('hide-example', !autoExample);
    document.getElementById('toggleExample').checked = autoExample;
  }
  document.getElementById('toggleExample').addEventListener('change', e => {
    autoExample = e.target.checked;
    setBoolPref(AUTO_EXAMPLE_KEY, autoExample);
    syncExampleToggle();
    if (autoExample) {
      document.querySelectorAll('#list .word-row').forEach(el => {
        const key = el.dataset.key;
        if (exampleCache[key] !== undefined) return;
        if (io) io.observe(el); else enqueueExample(el.dataset.word);
      });
    } else {
      exampleQueue.length = 0;
    }
  });

  /* =========================================================
     清空缓存（音标 + 例句）
     ========================================================= */
  document.getElementById('clearCache').addEventListener('click', () => {
    const phCount = Object.keys(phoneticCache).length;
    const exCount = Object.keys(exampleCache).length;
    if (!phCount && !exCount) {
      alert('当前没有已缓存的音标或例句。');
      return;
    }
    if (!confirm('将清空 ' + phCount + ' 条音标和 ' + exCount + ' 条例句缓存，之后浏览时会重新联网获取。是否继续？')) return;

    phoneticCache = {};
    exampleCache = {};
    saveCache(PHONETIC_CACHE_KEY, phoneticCache);
    saveCache(EXAMPLE_CACHE_KEY, exampleCache);
    phoneticQueue.length = 0; phoneticPending.clear();
    exampleQueue.length = 0; examplePending.clear();

    renderBrowse();

    if (io) {
      document.querySelectorAll('#list .word-row').forEach(el => {
        const key = el.dataset.key;
        const needP = autoPhonetic && phoneticCache[key] === undefined && !lookup(el.dataset.word)?.phonetic;
        const needE = autoExample && exampleCache[key] === undefined;
        if (needP || needE) io.observe(el);
      });
    }
  });

  /* =========================================================
     事件
     ========================================================= */
  document.getElementById('sidebar').addEventListener('click', e => {
    const btn = e.target.closest('.side-item');
    if (!btn || state.view === btn.dataset.view) return;
    setView(btn.dataset.view);
  });

  const listEl = document.getElementById('list');
  listEl.addEventListener('change', e => {
    const box = e.target;
    if (!box.classList || !box.classList.contains('box')) return;
    const row = box.closest('.word-row');
    if (!row) return;
    const key = row.dataset.key;
    if (box.checked) state.mastered.add(key); else state.mastered.delete(key);
    row.classList.toggle('mastered', box.checked);
    saveMastered(); updateProgress(); updateQuizNote();
  });

  const searchEl = document.getElementById('search');
  searchEl.addEventListener('input', () => { state.query = searchEl.value; renderBrowse(); });

  document.getElementById('reset').addEventListener('click', () => {
    if (!state.mastered.size) return;
    if (!confirm('确定清除所有「已掌握」标记吗？')) return;
    state.mastered.clear(); saveMastered(); renderBrowse(); updateQuizNote();
  });

  document.getElementById('quizScope').addEventListener('change', updateQuizNote);
  document.getElementById('quizStart').addEventListener('click', () => {
    startQuiz(getPool(document.getElementById('quizScope').value));
  });
  document.getElementById('quizForm').addEventListener('submit', e => { e.preventDefault(); submitAnswer(); });

  document.getElementById('quizHintBtn').addEventListener('click', () => {
    if (!quiz.running) return;
    const q = quiz.questions[quiz.index];
    const dictData = currentDictData(q);
    const ph = dictData.phonetic || phoneticCache[q.key] || '';
    const letters = q.word.replace(/[^A-Za-z]/g, '');
    document.getElementById('quizHint').textContent =
      '首字母 ' + q.word.charAt(0).toUpperCase() + ' · 共 ' + letters.length + ' 个字母' +
      (ph ? ' · /' + ph + '/' : '');
  });

  document.getElementById('quizSkip').addEventListener('click', skipQuestion);
  document.getElementById('quizQuit').addEventListener('click', () => {
    if (!quiz.running) { showQuizPane('setup'); return; }
    if (!confirm('确定结束本次复盘吗？已答错的内容会被记录。')) return;
    finishQuiz();
  });

  document.addEventListener('keydown', e => {
    if (state.view !== 'browse') return;
    if (e.key === '/' && document.activeElement !== searchEl) {
      e.preventDefault(); searchEl.focus(); searchEl.select();
    } else if (e.key === 'Escape' && document.activeElement === searchEl) {
      searchEl.value = ''; state.query = ''; renderBrowse(); searchEl.blur();
    }
  });

  /* =========================================================
     初始化
     ========================================================= */
  syncDefToggle();
  syncPhoneticToggle();
  syncExampleToggle();
  updateQuizNote();
  init();
})();
</script>
</body>
</html>
